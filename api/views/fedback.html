{% extends 'base.html' %}
{% block content %}

<!-- FORMULARIO DE CADASTRO -->
 <details>
    <summary>Cadrastrar um novo Fedback</summary>
    <div class="col-md-4">
        <form action="{{url_for('fedback')}}" method="POST">
            <input type="text" name="titulo" placeholder="Depoimento" class="form-control" required>
        <br>
        <input type="submit" value="Cadastrar" class="btn btn-success">
        <input type="reset" value="Limpar" class="btn btn-danger">
        </form>
    </div>
    
 </details>
<hr>

<h2>Fedbacks da Comunidade</h2>
<table class="table table-bordered table-hover">
    <tbody>
        {% for game in games%}
        <tr>
            <td>{{game.titulo}}</td>
               
            </td>
            <td>
                <a href="{{url_for('fedback', id=game.id)}}" class="btn btn-danger" onclick="return confirm('Deseja mesmo desadicionar o seu fedback?')">
                Deletar
            </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content%}
